# Bootstrap sekali jalan: menghasilkan pnpm-lock.yaml dan migrasi Prisma "init" yang belum ada di proyek,
# sekaligus menjalankan typecheck, test, dan build dengan dependensi asli.
#
# Dua cara memakainya:
#  A) Repo berisi SATU file `social-finder.zip` (hasil unduhan dari Claude) + file workflow ini.
#     Cocok dari HP: cukup upload satu file zip. Workflow membongkarnya sendiri.
#  B) Repo sudah berisi proyek lengkap (hasil git push dari komputer): workflow langsung berjalan.
#
# Jalankan: tab Actions -> "Bootstrap" -> Run workflow. Hasil: branch `bootstrap-output` + artifact `social-finder-bootstrapped`.
# BELUM TERUJI: workflow ini ditulis tanpa bisa dijalankan; bila gagal, kirim log langkah yang merah.
name: Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sf
          POSTGRES_PASSWORD: sf
          POSTGRES_DB: sf_boot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sf -d sf_boot" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://sf:sf@localhost:5432/sf_boot
    steps:
      - uses: actions/checkout@v4

      - name: Bongkar social-finder.zip (cara A)
        run: |
          if [ -f social-finder.zip ]; then
            rm -rf /tmp/sfzip && mkdir /tmp/sfzip
            unzip -q social-finder.zip -d /tmp/sfzip
            SRC=$(find /tmp/sfzip -maxdepth 2 -name package.json -path '*/social-finder/package.json' -printf '%h\n' | head -1)
            if [ -z "$SRC" ]; then SRC=/tmp/sfzip; fi
            test -f "$SRC/package.json" || { echo "package.json proyek tidak ditemukan di zip"; exit 1; }
            # .github tidak disalin ke working tree: GITHUB_TOKEN tidak boleh mengubah file workflow saat push.
            rsync -a --exclude '.github/' "$SRC"/ ./
            echo "SRC_DIR=$SRC" >> "$GITHUB_ENV"
            rm -f social-finder.zip
          else
            echo "Tidak ada social-finder.zip: memakai proyek yang sudah ada di repo."
          fi
          test -f package.json || { echo "package.json tidak ada di root repo"; exit 1; }

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Pasang dependensi (menghasilkan pnpm-lock.yaml)
        run: bash scripts/install-deps.sh

      - name: Siapkan PostGIS (template1 untuk shadow database Prisma, dan database utama)
        run: |
          psql "postgresql://sf:sf@localhost:5432/template1" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Buat migrasi init (+ extras.sql)
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          pnpm db:init-migration

      - name: Terapkan migrasi pada DB kosong (bukti migrasi valid)
        run: pnpm db:deploy

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck
      - name: Test unit
        id: test
        continue-on-error: true
        run: pnpm test
      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build

      - name: Ringkasan
        run: |
          {
            echo "## Hasil bootstrap"
            echo "- typecheck: ${{ steps.typecheck.outcome }}"
            echo "- test: ${{ steps.test.outcome }}"
            echo "- build: ${{ steps.build.outcome }}"
            echo "- pnpm-lock.yaml: $(test -f pnpm-lock.yaml && echo ada || echo TIDAK ADA)"
            echo "- migrasi: $(ls packages/database/prisma/migrations | grep -v lock | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Susun hasil (proyek lengkap tanpa node_modules)
        run: |
          mkdir -p /tmp/out
          rsync -a --exclude node_modules --exclude .git --exclude .env --exclude .next --exclude dist --exclude .turbo ./ /tmp/out/
          if [ -n "${SRC_DIR:-}" ] && [ -d "$SRC_DIR/.github" ]; then cp -r "$SRC_DIR/.github" /tmp/out/; fi
          rm -f /tmp/out/social-finder.zip

      - uses: actions/upload-artifact@v4
        with:
          name: social-finder-bootstrapped
          path: /tmp/out
          include-hidden-files: true

      - name: Push ke branch bootstrap-output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bootstrap-output
          git add -A
          git commit -m "bootstrap: pnpm-lock.yaml, migrasi init, dan proyek lengkap" || echo "tidak ada perubahan"
          git push --force origin bootstrap-output
