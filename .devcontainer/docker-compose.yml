# Lingkungan GitHub Codespaces / Dev Container: app + Postgres (PostGIS) + Redis. Hanya untuk uji dan
# pengembangan: kata sandi di sini sengaja sederhana dan layanan tidak dibuka ke luar container.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    volumes:
      - ..:/workspaces/social-finder:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sf
      POSTGRES_PASSWORD: sf_dev_only
      POSTGRES_DB: socialfinder
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docker/postgres/20-extensions.sql:/docker-entrypoint-initdb.d/20-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sf -d socialfinder"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
